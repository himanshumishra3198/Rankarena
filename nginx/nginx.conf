worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    upstream student_app { server frontend:80; }
    upstream admin_app   { server admin:80;    }
    upstream backend_api { server backend:4000; }

    # Let's Encrypt certs cover all three subdomains; they live at
    # /etc/letsencrypt/live/rankarena.hm0.org/ (first -d domain is the cert name).

    # ── HTTP → HTTPS redirect (all hosts) + ACME challenge ────────────────────
    server {
        listen 80 default_server;
        server_name rankarena.hm0.org admin.rankarena.hm0.org api.rankarena.hm0.org _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / { return 301 https://$host$request_uri; }
    }

    # ── Student Frontend — https://rankarena.hm0.org ──────────────────────────
    server {
        listen 443 ssl;
        server_name rankarena.hm0.org;

        ssl_certificate     /etc/letsencrypt/live/rankarena.hm0.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarena.hm0.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        location / {
            proxy_pass         http://student_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    # ── Admin Frontend — https://admin.rankarena.hm0.org ──────────────────────
    server {
        listen 443 ssl;
        server_name admin.rankarena.hm0.org;

        ssl_certificate     /etc/letsencrypt/live/rankarena.hm0.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarena.hm0.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://admin_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    # ── Backend API — https://api.rankarena.hm0.org ───────────────────────────
    server {
        listen 443 ssl;
        server_name api.rankarena.hm0.org;

        ssl_certificate     /etc/letsencrypt/live/rankarena.hm0.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarena.hm0.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        location / {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
