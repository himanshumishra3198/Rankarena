worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    upstream student_app { server frontend:80; }
    upstream admin_app   { server admin:80;    }
    upstream backend_api { server backend:4000; }

    # Let's Encrypt certs cover the apex + all subdomains; they live at
    # /etc/letsencrypt/live/rankarenas.com/ (first -d domain is the cert name).

    # ── HTTP → HTTPS redirect (all hosts) + ACME challenge ────────────────────
    server {
        listen 80 default_server;
        server_name rankarenas.com www.rankarenas.com admin.rankarenas.com api.rankarenas.com hm0.org www.hm0.org _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location / { return 301 https://$host$request_uri; }
    }

    # ── Student Frontend — https://rankarenas.com ─────────────────────────────
    # First 443 block, so it is also the default server for unmatched SNI.
    server {
        listen 443 ssl;
        server_name rankarenas.com;

        ssl_certificate     /etc/letsencrypt/live/rankarenas.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarenas.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        # The sitemap is generated by the API so newly published community
        # articles appear without a redeploy. It has to be served from the
        # apex domain — a sitemap may only list URLs on its own host.
        location = /sitemap.xml {
            proxy_pass         http://backend_api/sitemap.xml;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto https;
        }

        location / {
            proxy_pass         http://student_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    # ── www → apex redirect — https://www.rankarenas.com ──────────────────────
    server {
        listen 443 ssl;
        server_name www.rankarenas.com;

        ssl_certificate     /etc/letsencrypt/live/rankarenas.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarenas.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://rankarenas.com$request_uri;
    }

    # ── Admin Frontend — https://admin.rankarenas.com ─────────────────────────
    server {
        listen 443 ssl;
        server_name admin.rankarenas.com;

        ssl_certificate     /etc/letsencrypt/live/rankarenas.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarenas.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://admin_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    # ── Backend API — https://api.rankarenas.com ──────────────────────────────
    server {
        listen 443 ssl;
        server_name api.rankarenas.com;

        ssl_certificate     /etc/letsencrypt/live/rankarenas.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarenas.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        location / {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }

    # ── Sheet — https://hm0.org ───────────────────────────────────────────────
    # A separate project (github.com/himanshumishra3198/Sheet) deployed to
    # /home/ubuntu/sheet; its container joins this compose network as `sheet`.
    # Its cert is its own lineage, issued through the certbot service here.
    #
    # The upstream is resolved per request through Docker's DNS rather than in
    # an `upstream` block: a hostname that does not resolve at startup stops
    # nginx from starting at all, so a stopped sheet container would otherwise
    # take every rankarenas site down with it.
    server {
        listen 443 ssl;
        # Per-server (nginx >= 1.25.1): only hm0.org negotiates HTTP/2.
        http2 on;
        server_name hm0.org;

        ssl_certificate     /etc/letsencrypt/live/hm0.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hm0.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sheet_app http://sheet:3001;

        location / {
            proxy_pass         $sheet_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    # ── www → apex redirect — https://www.hm0.org ─────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name www.hm0.org;

        ssl_certificate     /etc/letsencrypt/live/hm0.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hm0.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        return 301 https://hm0.org$request_uri;
    }
}
