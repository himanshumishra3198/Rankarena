worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream backend_api {
        server backend:4000;
    }

    upstream student_app {
        server frontend:80;
    }

    upstream admin_app {
        server admin:80;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name rankarena.in www.rankarena.in api.rankarena.in admin.rankarena.in;

        # Let's Encrypt challenge (certbot uses this path)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Student Frontend ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name rankarena.in www.rankarena.in;

        ssl_certificate     /etc/letsencrypt/live/rankarena.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarena.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://student_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── Admin Frontend ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name admin.rankarena.in;

        ssl_certificate     /etc/letsencrypt/live/rankarena.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarena.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://admin_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── Backend API ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.rankarena.in;

        ssl_certificate     /etc/letsencrypt/live/rankarena.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rankarena.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Larger body for bulk question uploads
        client_max_body_size 10M;

        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for long-running requests
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
