worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    upstream student_app { server frontend:80; }
    upstream admin_app   { server admin:80;    }
    upstream backend_api { server backend:4000; }

    # ── Student Frontend — rankarena.hm0.org ──────────────────────────────────
    server {
        listen 80;
        server_name rankarena.hm0.org;
        client_max_body_size 10M;

        location / {
            proxy_pass         http://student_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── Admin Frontend — admin.rankarena.hm0.org ──────────────────────────────
    server {
        listen 80;
        server_name admin.rankarena.hm0.org;

        location / {
            proxy_pass         http://admin_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── Backend API — api.rankarena.hm0.org ───────────────────────────────────
    server {
        listen 80;
        server_name api.rankarena.hm0.org;
        client_max_body_size 10M;

        location / {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }

    # ── Fallback (raw IP or unknown host) → student app ───────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass         http://student_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
