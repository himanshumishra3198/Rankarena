name: Build → ECR → Deploy to EC2

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build Docker images and push to AWS ECR
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Enable Docker layer caching across runs (speeds up rebuilds ~50%)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context:   ./backend
          push:      true
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,mode=max,scope=backend
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/rankarena-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/rankarena-backend:latest

      # ── Student Frontend ─────────────────────────────────────────────────────
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context:   ./frontend
          push:      true
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/rankarena-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/rankarena-frontend:latest

      # ── Admin Frontend ───────────────────────────────────────────────────────
      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context:   ./admin
          push:      true
          cache-from: type=gha,scope=admin
          cache-to:   type=gha,mode=max,scope=admin
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/rankarena-admin:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/rankarena-admin:latest

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SSH into EC2, pull new images, run migrations, restart containers
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR password
        id: ecr-password
        run: echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   docker-compose.prod.yml
          target:   /home/ubuntu/rankarena/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     ECR_PASSWORD
          script: |
            set -e

            cd /home/ubuntu/rankarena

            # ── Auth ECR (password fetched on runner, no aws CLI needed on EC2) ─
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # ── Write IMAGE_TAG and ECR_REGISTRY into .env (add if missing) ────
            grep -q "^IMAGE_TAG=" .env \
              && sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ github.sha }}|" .env \
              || echo "IMAGE_TAG=${{ github.sha }}" >> .env

            grep -q "^ECR_REGISTRY=" .env \
              && sed -i "s|^ECR_REGISTRY=.*|ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}|" .env \
              || echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> .env

            # ── Pull new images ───────────────────────────────────────────────
            docker compose -f docker-compose.prod.yml pull backend frontend admin

            # ── Rolling restart ───────────────────────────────────────────────
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --remove-orphans \
              backend frontend admin proxy

            # ── Clean up dangling images ──────────────────────────────────────
            docker image prune -f

            echo "Deploy complete: ${{ github.sha }}"
        env:
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
