name: Build → ECR → Deploy to EC2

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  # Public API origin, baked into the frontend/admin bundles at build time.
  # Not a secret — kept here so a domain change is a one-line edit in the repo
  # rather than a manual GitHub secret update.
  VITE_API_URL: https://api.rankarenas.com
  # GA4 measurement id (G-XXXXXXXXXX). Leave empty to disable analytics
  # entirely — the tag is only injected when this has a value.
  VITE_GA_ID: "G-MQ6676CDQX"
  # Google sign-in client id. Public by design — it identifies the app to
  # Google and is visible in the page source either way; the client *secret*
  # is not used by this flow and must never appear here. Leave empty to hide
  # the Google button entirely.
  VITE_GOOGLE_CLIENT_ID: "426817550063-g6d51g9aj14b358u1b9914a10er49nmq.apps.googleusercontent.com"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build Docker images and push to AWS ECR
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Enable Docker layer caching across runs (speeds up rebuilds ~50%)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context:   ./backend
          push:      true
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,mode=max,scope=backend
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/rankarena-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/rankarena-backend:latest

      # ── Student Frontend ─────────────────────────────────────────────────────
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context:   ./frontend
          push:      true
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_GA_ID=${{ env.VITE_GA_ID }}
            VITE_GOOGLE_CLIENT_ID=${{ env.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/rankarena-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/rankarena-frontend:latest

      # ── Admin Frontend ───────────────────────────────────────────────────────
      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context:   ./admin
          push:      true
          cache-from: type=gha,scope=admin
          cache-to:   type=gha,mode=max,scope=admin
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/rankarena-admin:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/rankarena-admin:latest

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SSH into EC2, pull new images, run migrations, restart containers
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR password
        id: ecr-password
        run: echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      - name: Copy compose file + nginx configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.prod.yml,nginx/nginx.http.conf,nginx/nginx.conf"
          target:   /home/ubuntu/rankarena/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     ECR_PASSWORD
          script: |
            set -e

            cd /home/ubuntu/rankarena

            # ── Auth ECR (password fetched on runner, no aws CLI needed on EC2) ─
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # ── Write IMAGE_TAG and ECR_REGISTRY into .env (add if missing) ────
            grep -q "^IMAGE_TAG=" .env \
              && sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ github.sha }}|" .env \
              || echo "IMAGE_TAG=${{ github.sha }}" >> .env

            grep -q "^ECR_REGISTRY=" .env \
              && sed -i "s|^ECR_REGISTRY=.*|ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}|" .env \
              || echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> .env

            # ── Pull new images ───────────────────────────────────────────────
            docker compose -f docker-compose.prod.yml pull backend frontend admin

            # ── Run DB migrations (one-off, before restarting backend) ────────
            # Uses `run` so it gets the backend service env (DATABASE_URL etc.)
            # and exits; runs once per deploy rather than on every container start.
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              npx prisma migrate deploy

            # ── Rolling restart ───────────────────────────────────────────────
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --remove-orphans \
              backend frontend admin proxy

            # ── Restart proxy so nginx re-resolves upstream IPs ───────────────
            # frontend/admin/backend get new container IPs when recreated above;
            # nginx caches upstream IPs at startup, so without this the proxy
            # keeps pointing at the old (dead) IPs and returns 502.
            docker compose -f docker-compose.prod.yml restart proxy

            # ── Clean up dangling images ──────────────────────────────────────
            docker image prune -f

            echo "Deploy complete: ${{ github.sha }}"
        env:
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
