services:

  # ── Reverse Proxy (public-facing) ─────────────────────────────────────────
  # HTTPS: serves the three hm0.org subdomains over TLS (Let's Encrypt),
  # redirects HTTP->HTTPS, and serves the ACME challenge for renewals.
  # To revert to HTTP-only, mount ./nginx/nginx.http.conf instead.
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

  # ── Certbot (Let's Encrypt) ────────────────────────────────────────────────
  # Renews certs every 12h. Initial issuance is a one-off `run` command
  # (see the SSL runbook). nginx must be reloaded after a renewal to pick
  # up the new cert.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

  # ── Student Frontend ───────────────────────────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY}/rankarena-frontend:${IMAGE_TAG}
    restart: unless-stopped

  # ── Admin Frontend ─────────────────────────────────────────────────────────
  admin:
    image: ${ECR_REGISTRY}/rankarena-admin:${IMAGE_TAG}
    restart: unless-stopped

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/rankarena-backend:${IMAGE_TAG}
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 4000
      NODE_ENV: production
      # ── S3 image uploads ──
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # persist sorted sets across restarts
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  certbot_etc:
  certbot_www:
