services:

  # ── Reverse Proxy (public-facing) ─────────────────────────────────────────
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro       # SSL certs from host
      - /var/www/certbot:/var/www/certbot:ro        # ACME challenge files
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

  # ── Student Frontend ───────────────────────────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY}/rankarena-frontend:${IMAGE_TAG}
    restart: unless-stopped

  # ── Admin Frontend ─────────────────────────────────────────────────────────
  admin:
    image: ${ECR_REGISTRY}/rankarena-admin:${IMAGE_TAG}
    restart: unless-stopped

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/rankarena-backend:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # persist sorted sets across restarts
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
