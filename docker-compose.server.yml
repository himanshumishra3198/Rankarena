# docker-compose.server.yml
# Use this for the FIRST deploy on EC2 (builds images from source, no ECR needed).
# For future deploys, CI/CD uses docker-compose.prod.yml + ECR.
#
# Usage:
#   docker compose -f docker-compose.server.yml up -d --build

services:

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.http.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - admin
    restart: unless-stopped

  # ── Student Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped

  # ── Admin Frontend ─────────────────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
