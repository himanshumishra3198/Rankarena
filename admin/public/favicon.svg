<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- RankArenas mark: podium bars in a rounded badge. Flat fills only, so it
       stays crisp in browser tabs and bookmark bars at 16px. -->
  <rect width="32" height="32" rx="9" fill="#2563eb"/>
  <rect x="7"    y="18" width="5" height="8"  rx="1.6" fill="#fff"/>
  <rect x="13.5" y="12" width="5" height="14" rx="1.6" fill="#fff"/>
  <rect x="20"   y="6"  width="5" height="20" rx="1.6" fill="#fff"/>
</svg>
